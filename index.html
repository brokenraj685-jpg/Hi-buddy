async function startChatWith(uid,targetProfile){
 if(!user||uid===user.uid)return;
 try{
  // Check Firestore directly as well as the in-memory/cache list to avoid duplicate chats after app restarts.
  const existingLocal=chats.find(c=>c.members?.includes(user.uid)&&c.members?.includes(uid));
  if(existingLocal){openChat(existingLocal.id);return}
  const existingSnap=await getDocs(query(collection(db,"chats"),where("members","array-contains",user.uid)));
  const existingDoc=existingSnap.docs.find(d=>(d.data().members||[]).includes(uid));
  if(existingDoc){const c={id:existingDoc.id,...existingDoc.data()};if(!chats.some(x=>x.id===c.id))chats.push(c);saveChatCache();draw();openChat(c.id);return}
  const names={[user.uid]:profile?.name||"Me",[uid]:targetProfile?.name||targetProfile?.username||"Buddy"};
  const created={members:[user.uid,uid],names,lastMessage:"",createdAt:serverTimestamp()};
  const result=await addDoc(collection(db,"chats"),created);
  const chat={id:result.id,...created};chats.push(chat);saveChatCache();draw();openChat(result.id);say("Chat opened");
 }catch(e){
  if(e.code==="permission-denied")say("Chat not allowed. The other user may have disabled new chats or blocked this account. Check published Firestore Rules.");
  else say(err(e));
 }
}

async function switchCallCamera(){try{if(!localCallStream||!callPeer)return;const nextFacing=cameraFacing==="user"?"environment":"user",stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:nextFacing},width:{ideal:640},height:{ideal:480}},audio:false}),next=stream.getVideoTracks()[0],old=localCallStream.getVideoTracks()[0],sender=callPeer.getSenders().find(x=>x.track?.kind==="video");if(!sender)throw Error("Camera track unavailable");await sender.replaceTrack(next);if(old){localCallStream.removeTrack(old);old.stop()}localCallStream.addTrack(next);cameraFacing=nextFacing;const local=$("#call-local-video");if(local){local.srcObject=localCallStream;local.play?.().catch(()=>{})}}catch(e){say("Could not switch camera: "+err(e))}}
function setCallStatus(s){const el=$("#call-status");if(el)el.textContent=s}
function attachCallMedia(videoMode){

 if(remote&&remoteCallStream){remote.srcObject=remoteCallStream;remote.play?.().catch(()=>{})}
 if(local&&localCallStream){local.srcObject=localCallStream;local.play?.().catch(()=>{})}
}
async function getCallMedia(type){

}
function initPeer(callRef,role,type){
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});callPeer=pc;remoteCallStream=new MediaStream();pc._lastRemoteSdp="";
 localCallStream.getTracks().forEach(t=>pc.addTrack(t,localCallStream));pc.ontrack=e=>{e.streams[0]?.getTracks().forEach(t=>{if(!remoteCallStream.getTracks().some(x=>x.id===t.id))remoteCallStream.addTrack(t)});attachCallMedia(type==="video")};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected"){setCallStatus("Connected");if(currentCall?.status==="accepted")startCallDuration();if(callReconnectTimer){clearTimeout(callReconnectTimer);callReconnectTimer=null}}if(["failed","disconnected"].includes(pc.connectionState)){setCallStatus("Connection interrupted. Reconnecting…");if(role==="caller"&&!callReconnectTimer)callReconnectTimer=setTimeout(async()=>{callReconnectTimer=null;if(!currentCall||callPeer!==pc||pc.connectionState==="connected")return;try{pc.restartIce();const offer=await pc.createOffer({iceRestart:true});await pc.setLocalDescription(offer);await updateDoc(callRef,{offer:{type:offer.type,sdp:offer.sdp}});setCallStatus("Reconnecting…")}catch(e){setCallStatus("Network reconnect failed. Check your connection.")}},1800)}};

 pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,"calls",callRef.id,ownPath),e.candidate.toJSON()).catch(x=>say("Could not send call network data: "+err(x)))};

 });return pc;
}
async function startCall(type){
 if(!active||!user)return say("Open a chat first");
 if(currentCall)return say("A call is already active");
 const target=callOtherUser();if(!target)return say("Chat partner not found");
 try{
  localCallStream=await getCallMedia(type);
  const callRef=doc(collection(db,"calls"));
  currentCall={id:callRef.id,ref:callRef,role:"caller",type,targetUid:target,status:"ringing"};
  await setDoc(callRef,{callerUid:user.uid,calleeUid:target,chatId:active,callerName:profile?.name||"HI BUDDY",calleeName:chats.find(x=>x.id===active)?.names?.[target]||"Buddy",type,status:"ringing",createdAt:serverTimestamp()});
  const peer=initPeer(callRef,"caller",type);
  showCallPanel(type, type==="video"?"Video call":"Voice call","Calling…",type==="video");
  attachCallMedia(type==="video");startCallRingtone();
  const offer=await peer.createOffer();await peer.setLocalDescription(offer);
  await updateDoc(callRef,{offer:{type:offer.type,sdp:offer.sdp}});
  callRingTimer=setTimeout(async()=>{if(currentCall?.id!==callRef.id)return;try{const latest=await getDoc(callRef);if(latest.exists()&&latest.data().status==="ringing"){await updateDoc(callRef,{status:"missed",endedAt:serverTimestamp()});say("No answer")} }catch{}cleanupCall()},45000);
 }catch(e){say("Could not start call: "+err(e));cleanupCall()}
}
function listenForIncomingCalls(){
 if(stopIncomingCalls)stopIncomingCalls();
 if(!user)return;
 stopIncomingCalls=onSnapshot(query(collection(db,"calls"),where("calleeUid","==",user.uid)),snap=>{
  for(const d of snap.docs){
   const data=d.data();
   if(data.status==="ringing"&&data.offer&&!currentCall&&!seenIncomingCalls.has(d.id)){
    seenIncomingCalls.add(d.id);currentCall={id:d.id,ref:d.ref,role:"callee",type:data.type||"audio",targetUid:data.callerUid,status:"ringing"};
    showCallPanel(data.type||"audio",data.callerName||"Incoming call","Incoming "+(data.type==="video"?"video":"voice")+" call",data.type==="video",true,data);
    break;
   }
  }
 },e=>say("Incoming call listener: "+err(e)));
}
async function acceptIncomingCall(){
 if(!currentCall||currentCall.role!=="callee")return;
 stopCallRingtone();
 try{
  const ref=currentCall.ref,snap=await getDoc(ref);if(!snap.exists())throw Error("Call no longer exists");
  const data=snap.data();if(data.status!=="ringing"||!data.offer)throw Error("Caller has ended this call");
  localCallStream=await getCallMedia(data.type||"audio");
  const peer=initPeer(ref,"callee",data.type||"audio");
  showCallPanel(data.type==="video"?"video":"audio",data.callerName||"Call","Connecting…",data.type==="video");
  attachCallMedia(data.type==="video");
  await peer.setRemoteDescription(new RTCSessionDescription(data.offer));peer._lastRemoteSdp=data.offer.sdp;for(const candidate of pendingRemoteCandidates.splice(0))await peer.addIceCandidate(candidate).catch(()=>{});
  const answer=await peer.createAnswer();await peer.setLocalDescription(answer);
  await updateDoc(ref,{answer:{type:answer.type,sdp:answer.sdp},status:"accepted",acceptedAt:serverTimestamp()});
 }catch(e){say("Could not accept call: "+err(e));cleanupCall()}
}
async function declineIncomingCall(){
 if(!currentCall)return;
 try{await updateDoc(currentCall.ref,{status:"rejected"})}catch(e){say(err(e))}
 cleanupCall();
}
async function endCall(){
 if(!currentCall)return;
 const ref=currentCall.ref;
 try{const snap=await getDoc(ref),data=snap.exists()?snap.data():{},accepted=callDateValue(data.acceptedAt),durationSeconds=accepted?Math.max(0,Math.floor((Date.now()-accepted.getTime())/1000)):0;await updateDoc(ref,{status:"ended",endedAt:serverTimestamp(),durationSeconds})}catch(e){say(err(e))}

}
function cleanupCall(){
 stopCallRingtone();stopCallDuration();if(callReconnectTimer){clearTimeout(callReconnectTimer);callReconnectTimer=null}
 if(callRingTimer){clearTimeout(callRingTimer);callRingTimer=null}
 if(stopCallDoc){stopCallDoc();stopCallDoc=null}
 if(stopRemoteCandidates){stopRemoteCandidates();stopRemoteCandidates=null}
 if(callPeer){callPeer.ontrack=null;callPeer.onicecandidate=null;callPeer.close();callPeer=null}

}

.setting-row{width:100%;display:flex;align-items:center;text-align:left;gap:10px;min-height:48px;padding:7px 1px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);transition:background .16s,transform .16s}
.setting-row:last-child{border-bottom:0}.setting-row:active{transform:scale(.99)}
.setting-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--brand);font-size:14px;flex:none}
.setting-meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.setting-meta b{font-size:11px;font-weight:800}.setting-meta small{font-size:9px;color:var(--muted);font-weight:500}
.setting-value{font-size:10px;color:var(--muted);white-space:nowrap}
.setting-action{border:1px solid var(--line);background:var(--panel2);color:var(--brand);border-radius:10px;padding:7px 10px;font-size:10px;font-weight:800}
.settings-detail{margin:12px 0 20px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 8px 24px #102e6409;animation:rise .2s ease both}
.detail-heading{font-size:13px;font-weight:900;margin-bottom:8px}.settings-detail p{font-size:10px;line-height:1.6;color:var(--muted);margin:6px 0 12px}
.settings-field{display:flex;flex-direction:column;gap:6px;font-size:10px;font-weight:800;color:var(--muted);margin:10px 0}
.settings-field input,.settings-field select{height:39px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:0 10px;font:inherit;font-size:11px;min-width:0}
.settings-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.settings-toggle:last-of-type{border-bottom:0}.settings-toggle span{display:flex;flex-direction:column;gap:3px}.settings-toggle b{font-size:10px}.settings-toggle small{font-size:9px;color:var(--muted)}
.settings-toggle input{accent-color:var(--brand);width:18px;height:18px;flex:none}
.primary-setting-btn,.secondary-setting-btn,.danger-setting-btn{width:100%;min-height:38px;border:0;border-radius:11px;padding:9px 12px;margin-top:10px;font-size:11px;font-weight:850;transition:transform .16s,filter .16s}
.primary-setting-btn{background:linear-gradient(135deg,#087cf0,#10b9e8);color:white;box-shadow:0 6px 16px #087cf02b}
.secondary-setting-btn{background:var(--tint);color:var(--brand)}.danger-setting-btn{background:#fff0f0;color:#c03939}
.settings-info{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.settings-info span{color:var(--muted)}.settings-info b{font-weight:800}
.settings-note{font-size:9px!important;color:var(--muted)!important}
.bottom-nav{height:64px!important;gap:5px;padding:5px 8px max(5px,env(safe-area-inset-bottom))!important;background:color-mix(in srgb,var(--panel) 92%,transparent)!important;backdrop-filter:blur(20px);border-top:1px solid var(--line);box-shadow:0 -7px 22px #102e6408}
.tab{position:relative;flex:1;min-width:0;border:1px solid transparent!important;border-radius:13px!important;gap:3px!important;font-size:17px!important;transition:background .18s,color .18s,transform .18s!important}
.tab span{font-size:9px!important;font-weight:800;letter-spacing:.01em}.tab.active{background:var(--tint)!important;border-color:color-mix(in srgb,var(--brand) 12%,transparent)!important;color:var(--brand)!important;transform:translateY(-1px)}
.tab:active{transform:scale(.96)}
@media(max-width:820px){.bottom-nav{height:62px!important}.page{padding:13px!important}.settings-titlebar h2{font-size:19px!important}.settings-group{margin:10px 0}.setting-row{min-height:46px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

 
.settings-profile-link{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.settings-avatar{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#9bd9c4,#267b65);color:#fff;font-size:17px;font-weight:850}
.settings-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.settings-subpage{min-height:100%;padding-bottom:24px;animation:rise .18s ease both}
.settings-subhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:13px;padding:9px 0 14px;margin-bottom:12px;background:var(--bg);border-bottom:1px solid var(--line)}
.settings-back{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);font-size:27px;line-height:1}
.settings-subhead div{display:flex;flex-direction:column;gap:3px}.settings-subhead b{font-size:15px}.settings-subhead small{font-size:10px;color:var(--muted)}
.settings-detail{margin:0!important;padding:16px!important;border-radius:17px!important}
.settings-detail-host{min-width:0}
.settings-field textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:10px;font:inherit;font-size:11px}
.settings-profile-photo{width:104px;height:104px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--tint);color:var(--brand);font-size:24px;font-weight:900;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.settings-profile-photo img{width:100%;height:100%;object-fit:cover;display:block}
.settings-qr{display:block;width:190px;height:190px;object-fit:contain;background:#fff;padding:9px;border-radius:14px;margin:12px auto}
@media(max-width:820px){.settings-subhead{padding-top:4px}.settings-detail{padding:14px!important}.settings-profile-link{min-height:78px}}
</style>
</head>
<body>
<section id="auth"><div class="auth-shell"><div class="brand"><div class="brand-mark"><img src="/icons/icon-192.png" alt="HI BUDDY"></div><div><div class="brand-name">HI BUDDY</div></div></div><div id="authform"></div></div></section>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><div class="brand-mark"><img src="/icons/icon-192.png" alt="HI BUDDY"></div><div><div class="brand-name">HI BUDDY</div></div></div><button class="icon-btn" id="theme" title="Toggle theme">◐</button><button class="icon-btn" id="add" title="New chat">＋</button><button class="icon-btn" id="settings" title="Settings">⚙</button></header>
<div class="workspace" id="workspace">
<aside class="sidebar"><div class="side-head"><h2 id="heading">Messages</h2><div class="side-actions"><button class="icon-btn" id="find" title="Search">⌕</button><button class="icon-btn" id="newchat" title="New chat">＋</button></div></div><div class="search-wrap"><span>⌕</span><input id="searchinput" placeholder="Search conversations"></div><div class="chat-list" id="people"></div></aside>
<main class="main"><div class="welcome" id="empty"><div><div class="welcome-mark">✉</div><h2>Your conversations, together.</h2></div></div>
<div class="chat-view hidden" id="chat"><div class="chat-head"><button class="icon-btn back-btn" id="back">‹</button><div class="avatar" id="chatavatar">?</div><div><div class="chat-title" id="chatname">Chat</div></div><div class="grow"></div><button class="icon-btn" title="More options" id="chatmore">···</button></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><textarea id="message" rows="1" placeholder="Write a message…"></textarea><button class="send-btn" id="send" title="Send">➤</button></div></div></div><div class="page hidden" id="page"></div></main>
</div>
<nav class="bottom-nav"><button class="tab active" data-tab="chats">▤<span>Chats</span></button><button class="tab" data-tab="updates">◉<span>Updates</span></button><button class="tab" data-tab="calls">☎<span>Calls</span></button><button class="tab" data-tab="settings">⚙<span>Settings</span></button></nav></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,onSnapshot,addDoc,serverTimestamp,orderBy,limit,getDocs,updateDoc,deleteDoc,deleteField}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyASzfkpNVtanzi2XQIBYmvxXPTUcqZ6NBM",authDomain:"raj-11988.firebaseapp.com",databaseURL:"https://raj-11988-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"raj-11988",storageBucket:"raj-11988.firebasestorage.app",messagingSenderId:"1080242151967",appId:"1:1080242151967:web:1cc8fb6fc8a9e94b2e2b2a",measurementId:"G-CPHXNZQFNN"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s);
await setPersistence(auth,browserLocalPersistence);
let mode="signup",captcha=0,user=null,profile=null,chats=[],active=null,stopChats=null,stopMsgs=null;
function say(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600)}
function email(p){return p+"@hibuddy.invalid"}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ini(s=""){return s.split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase()}
function err(e){let c=e.code||"";if(c.includes("email-already-in-use"))return"Mobile number already registered";if(c.includes("invalid-credential"))return"Mobile number or password is incorrect";if(c.includes("weak-password"))return"Password must be at least 6 characters";if(c.includes("operation-not-allowed"))return"Enable Email/Password in Firebase Authentication";if(c.includes("permission-denied"))return"Firestore rules denied access. Check your Rules tab.";return e.message||"Something went wrong"}
function authUI(){let f=$("#authform");if(mode==="signup"){let a=2+Math.floor(Math.random()*7),b=1+Math.floor(Math.random()*8);captcha=a+b;f.innerHTML='<div class="auth-intro"><h1>Create your account</h1></div><label class="field"><span>Mobile number</span><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label><label class="field"><span>Full name</span><input id="fullname" placeholder="Your full name"></label><label class="field"><span>Username</span><input id="username" placeholder="3–20 letters, numbers or _"></label><label class="field"><span>Password</span><input id="password" type="password" placeholder="At least 6 characters"></label><div class="captcha"><span>Human check&nbsp; <b>'+a+' + '+b+' = ?</b></span><input id="answer" inputmode="numeric" aria-label="Captcha answer"></div><button class="primary wide" id="signup">Create account&nbsp; →</button><div class="auth-foot"><span class="tiny">Already have an account?</span><button class="text-btn" id="toLogin">Log in</button></div>';$("#signup").onclick=signup;$("#toLogin").onclick=()=>{mode="login";authUI()}}else{f.innerHTML='<div class="auth-intro"><h1>Welcome back</h1><p>Log in to pick up where you left off.</p></div><label class="field"><span>Mobile number</span><input id="lphone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label><label class="field"><span>Password</span><input id="lpassword" type="password" placeholder="Your password"></label><button class="primary wide" id="login">Log in&nbsp; →</button><div class="auth-foot"><span class="tiny">New to HI BUDDY?</span><button class="text-btn" id="toSignup">Create account</button></div>';$("#login").onclick=login;$("#toSignup").onclick=()=>{mode="signup";authUI()}}}
async function signup(){let p=$("#phone").value.trim(),n=$("#fullname").value.trim(),u=$("#username").value.trim().toLowerCase(),pw=$("#password").value;if(!/^\d{10}$/.test(p)||!n||!/^[a-z0-9_]{3,20}$/.test(u)||pw.length<6||Number($("#answer").value)!==captcha)return say("Check your details and CAPTCHA");try{let taken=await getDocs(query(collection(db,"profiles"),where("username","==",u),limit(1)));if(!taken.empty)return say("Username already taken");let cr=await createUserWithEmailAndPassword(auth,email(p),pw);await setDoc(doc(db,"profiles",cr.user.uid),{name:n,username:u,createdAt:serverTimestamp()});say("Account created")}catch(e){say(err(e))}}
async function login(){let p=$("#lphone").value.trim(),pw=$("#lpassword").value;if(!/^\d{10}$/.test(p)||!pw)return say("Enter mobile number and password");try{await signInWithEmailAndPassword(auth,email(p),pw)}catch(e){say(err(e))}}
onAuthStateChanged(auth,async u=>{if(!u){user=null;profile=null;$("#app").classList.add("hidden");$("#auth").classList.remove("hidden");if(stopChats)stopChats();if(stopMsgs)stopMsgs();return}user=u;try{let s=await getDoc(doc(db,"profiles",u.uid));if(!s.exists())throw Error("Profile not found. Please contact support.");let priv=await getDoc(doc(db,"privateUsers",u.uid));let publicData=s.data(),privateData=priv.exists()?priv.data():{};let movePhoto=!!publicData.photo&&!privateData.photo,moveAbout=!!publicData.about&&!privateData.about;if(movePhoto||moveAbout){if(movePhoto)privateData.photo=publicData.photo;if(moveAbout)privateData.about=publicData.about;await setDoc(doc(db,"privateUsers",u.uid),{...(movePhoto?{photo:privateData.photo}:{}),...(moveAbout?{about:privateData.about}:{})},{merge:true});await updateDoc(doc(db,"profiles",u.uid),{...(publicData.photo?{photo:deleteField()}:{}),...(publicData.about?{about:deleteField()}:{})});delete publicData.photo;delete publicData.about;}profile={...publicData,...privateData};$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");listen()}catch(e){say(err(e))}});
function listen(){if(stopChats)stopChats();stopChats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",user.uid)),s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>say(err(e)))}
function draw(){let term=$("#searchinput").value.toLowerCase();let rows=chats.filter(c=>(c.names?.[c.members.find(x=>x!==user.uid)]||"").toLowerCase().includes(term));$("#people").innerHTML=rows.map(c=>{let other=c.members.find(x=>x!==user.uid),n=c.names?.[other]||"Buddy";return'<button class="person '+(active===c.id?"selected":"")+'" data-id="'+c.id+'"><div class="avatar">'+esc(ini(n))+'</div><div class="person-info"><div class="person-name">'+esc(n)+'</div><div class="person-preview">'+esc(c.lastMessage||"Start a conversation")+'</div></div></button>'}).join("")||'<p class="tiny" style="padding:14px">No conversations yet. Tap + to find someone by username.</p>'}
function openChat(id){active=id;let c=chats.find(x=>x.id===id);if(!c)return;let other=c.members.find(x=>x!==user.uid),n=c.names?.[other]||"Buddy";$("#chatname").textContent=n;$("#chatavatar").textContent=ini(n);$("#workspace").classList.add("chat-open");$("#empty").classList.add("hidden");$("#page").classList.add("hidden");$("#chat").classList.remove("hidden");if(stopMsgs)stopMsgs();stopMsgs=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"),limit(150)),s=>{$("#msgs").innerHTML=s.docs.map(d=>{let m=d.data();return'<div class="bubble '+(m.sender===user.uid?"mine":"")+'">'+esc(m.text)+'<small>'+(m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Sending…")+'</small></div>'}).join("");$("#msgs").scrollTop=$("#msgs").scrollHeight},e=>say(err(e)));draw()}
async function send(){let t=$("#message").value.trim();if(!t||!active)return;$("#message").value="";try{await addDoc(collection(db,"chats",active,"messages"),{text:t,sender:user.uid,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",active),{lastMessage:t,lastAt:serverTimestamp()},{merge:true})}catch(e){$("#message").value=t;say(err(e))}}
async function newChat(){let u=prompt("Enter exact username");if(!u)return;try{let s=await getDocs(query(collection(db,"profiles"),where("username","==",u.trim().toLowerCase()),limit(1)));if(s.empty)return say("Username not found");let target=s.docs[0];if(target.id===user.uid)return say("This is your own username");let old=chats.find(c=>c.members.includes(target.id)&&c.members.includes(user.uid));if(old)return openChat(old.id);let names={[user.uid]:profile.name,[target.id]:target.data().name};let r=await addDoc(collection(db,"chats"),{members:[user.uid,target.id],names,lastMessage:"",createdAt:serverTimestamp()});say("Chat created");setTimeout(()=>{let c=chats.find(x=>x.id===r.id);if(c)openChat(c.id)},700)}catch(e){say(err(e))}}
function settingsHome(){
 const n=esc(profile?.name||"HI BUDDY"),u=esc(profile?.username||"");
 const row=(icon,name,desc,action,value="›")=>`<button type="button" class="setting-row" data-setting="${action}"><span class="setting-icon">${icon}</span><span class="setting-meta"><b>${name}</b><small>${desc}</small></span><span class="setting-value">${value}</span></button>`;
 const theme=document.documentElement.dataset.theme==="dark"?"Dark":"Light";
 const size=localStorage.getItem("hibuddy-chat-font")||"12";
 $("#page").innerHTML=`<div class="settings-titlebar"><div><h2>Settings</h2><p>Manage your profile, account and preferences</p></div><span class="settings-title-icon">⚙</span></div>
 <button class="settings-hero settings-profile-link" type="button" data-setting="profile"><div class="settings-avatar">${profile?.photo?`<img src="${profile.photo}" alt="Profile photo">`:esc(ini(profile?.name||"HB"))}</div><div class="person-info"><div class="person-name">${n}</div><div class="person-preview">@${u} · View your profile</div></div><span class="setting-value">›</span></button>
 <section class="settings-group"><div class="settings-label">ACCOUNT</div><div class="settings-card">${row("♙","Profile","Photo, name, about, number and QR code","profile")}${row("🔐","Account & security","Account information, password help and logout","security")}</div></section>
 <section class="settings-group"><div class="settings-label">PRIVACY</div><div class="settings-card">${row("🔒","Privacy controls","Profile visibility and privacy preferences","privacy")}${row("🚫","Blocked contacts","Manage blocked people","blocked")}</div></section>
 <section class="settings-group"><div class="settings-label">CHATS</div><div class="settings-card">${row("💬","Chat settings","Text size and message sending","chats",size+" px")}${row("🗂","Storage & data","Storage estimate and cache controls","storage")}</div></section>
 <section class="settings-group"><div class="settings-label">PREFERENCES</div><div class="settings-card">${row("◐","Appearance","Light or dark theme","appearance",theme)}${row("♬","Notifications","Notification permission","notifications")}${row("🌐","Language","App language","language","English")}</div></section>
 <section class="settings-group"><div class="settings-label">SUPPORT</div><div class="settings-card">${row("ⓘ","About HI BUDDY","App version and backend","about")}${row("✉","Help & support","Help using the app","help")}${row("↪","Log out","Sign out from this device","logout")}</div></section>`;
 $("#page").querySelectorAll("[data-setting]").forEach(el=>el.addEventListener("click",()=>settingAction(el.dataset.setting)));
}
async async async function savePrivacySettings(){
 const host=$("#settings-detail"),privacy={};
 host.querySelectorAll("[data-privacy]").forEach(el=>privacy[el.dataset.privacy]=el.checked);
 try{await setDoc(doc(db,"privateUsers",user.uid),{preferences:{...(profile?.preferences||{}),privacy}},{merge:true});profile={...profile,preferences:{...(profile?.preferences||{}),privacy}};say("Privacy preferences saved");}
 catch(e){say(err(e));}
}
function settingAction(which){
 const page=$("#page");
 page.innerHTML=`<div class="settings-subpage"><div class="settings-subhead"><button type="button" class="settings-back" id="settings-back" aria-label="Back to settings">‹</button><div><b>${({profile:"Profile",security:"Account & security",privacy:"Privacy",blocked:"Blocked contacts",chats:"Chat settings",storage:"Storage & data",appearance:"Appearance",notifications:"Notifications",language:"Language",about:"About HI BUDDY",help:"Help & support",logout:"Log out"})[which]||"Settings"}</b><small>HI BUDDY settings</small></div></div><div id="settings-detail" class="settings-detail-host"></div></div>`;
 const box=$("#settings-detail");
 $("#settings-back").onclick=settingsHome;
 if(which==="appearance"){const current=document.documentElement.dataset.theme==="dark"?"Dark":"Light";box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Appearance</div><p>Choose the theme for this device.</p><div class="settings-info"><span>Current theme</span><b id="current-theme">${current}</b></div><button class="primary-setting-btn" id="toggle-appearance">Switch to ${current==="Dark"?"Light":"Dark"} mode</button></div>`;$("#toggle-appearance").onclick=()=>{toggleTheme();const now=document.documentElement.dataset.theme==="dark"?"Dark":"Light";$("#current-theme").textContent=now;$("#toggle-appearance").textContent="Switch to "+(now==="Dark"?"Light":"Dark")+" mode";say("Appearance saved")};return}
 if(which==="logout"){if(confirm("Log out from HI BUDDY on this device?"))signOut(auth).catch(e=>say(err(e)));return}
 if(which==="profile"){
  const phone=(user?.email||"").replace("@hibuddy.invalid","");
  const qrText=encodeURIComponent("HI BUDDY\\nName: "+(profile?.name||"")+"\\nUsername: @"+(profile?.username||"")+"\\nMobile: "+phone);
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">My profile</div>
   <div style="display:flex;align-items:center;gap:14px;margin:10px 0 16px"><div class="settings-profile-photo">${profile?.photo?`<img src="${profile.photo}" alt="Profile photo">`:esc(ini(profile?.name||"HB"))}</div><div><label class="primary-setting-btn" for="profile-photo-file" style="display:inline-block;cursor:pointer">Change photo</label><input id="profile-photo-file" type="file" accept="image/*" hidden><button class="text-btn" id="remove-profile-photo" type="button">Remove photo</button><small class="tiny" style="display:block">JPG/PNG, image will be compressed</small></div></div>
   <label class="settings-field">Full name<input id="edit-profile-name" maxlength="50" value="${esc(profile?.name||"")}"></label>
   <label class="settings-field">Username<input value="@${esc(profile?.username||"")}" disabled></label>
   <label class="settings-field">Mobile number<input value="${esc(phone)}" disabled></label>
   <label class="settings-field">About me<textarea id="edit-profile-about" maxlength="160" rows="3" placeholder="Tell people a little about yourself">${esc(profile?.about||"")}</textarea></label>
   <button class="primary-setting-btn" id="save-profile-name">Save profile</button>
   <div style="margin-top:18px;text-align:center"><b>My HI BUDDY QR</b><p class="tiny">Scan to view these profile details</p><img alt="Profile QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrText}" style="width:180px;height:180px;max-width:100%;background:#fff;padding:8px;border-radius:12px"></div>
   <p class="settings-note">Mobile number and username are shown as read-only. Changing the registered number needs a secure account migration flow.</p></div>`;
  $("#save-profile-name").onclick=async()=>{let name=$("#edit-profile-name").value.trim(),about=$("#edit-profile-about").value.trim();if(!name)return say("Enter your name");try{await updateDoc(doc(db,"profiles",user.uid),{name});await setDoc(doc(db,"privateUsers",user.uid),{about},{merge:true});profile={...profile,name,about};settingAction("profile");say("Profile saved")}catch(e){say(err(e))}};
  $("#profile-photo-file").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith("image/"))return say("Choose an image file");try{const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,640/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.72))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)});if(data.length>260000)return say("Photo is too large. Choose a smaller image.");await setDoc(doc(db,"privateUsers",user.uid),{photo:data},{merge:true});profile={...profile,photo:data};settingAction("profile");say("Profile photo saved")}catch(ex){say(err(ex))}};
  $("#remove-profile-photo").onclick=async()=>{if(!profile?.photo)return say("No profile photo to remove");if(!confirm("Remove your profile photo?"))return;try{await setDoc(doc(db,"privateUsers",user.uid),{photo:""},{merge:true});profile={...profile,photo:""};settingAction("profile");say("Profile photo removed")}catch(e){say(err(e))}};return;
 }
 if(which==="security"){
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Account & security</div><p>Your account uses the existing mobile-number + password sign-in. No OTP is required.</p><div class="settings-info"><span>Username</span><b>@${esc(profile?.username||"")}</b></div><div class="settings-info"><span>Authentication</span><b>Firebase Email/Password</b></div><button class="secondary-setting-btn" id="switch-account">Switch account</button><button class="danger-setting-btn" id="security-logout">Log out</button><p class="settings-note">Switch account signs out this account so you can log in with another registered mobile number. Passwords are not stored on this device.</p><p class="settings-note">Permanent account deletion needs trusted server-side cleanup. It is not enabled on the current Firebase Spark plan, so this screen will not pretend to delete your account.</p></div>`;
  $("#switch-account").onclick=async()=>{mode="login";authUI();try{await signOut(auth)}catch(e){say(err(e))}};
  $("#security-logout").onclick=()=>{if(confirm("Log out from this device?")){mode="login";authUI();signOut(auth).catch(e=>say(err(e)))}};return;
 }
 if(which==="privacy"){
  const p=profile?.preferences?.privacy||{};
  const t=(key,title,desc)=>`<label class="settings-toggle"><span><b>${title}</b><small>${desc}</small></span><input type="checkbox" data-privacy="${key}" ${p[key]===false?"":"checked"}></label>`;
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Privacy preferences</div><p>Choose who can start a new chat with you. This setting is checked by Firestore Rules. Your profile photo and About remain private. Online status, last seen and read receipts are not implemented yet.</p>${t("allowNewChats","Allow new chats","When off, other users cannot create a new chat with you") }<div class="settings-info"><span>Profile photo & About</span><b>Private</b></div><div class="settings-info"><span>Online / last seen / read receipts</span><b>Not available yet</b></div><button class="primary-setting-btn" id="save-privacy">Save preferences</button></div>`;
  $("#save-privacy").onclick=savePrivacySettings;return;
 }
 if(which==="blocked"){
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Blocked contacts</div><p>Blocked people cannot start a new chat with you or send messages in an existing chat. Enter their exact username to block them.</p><button class="primary-setting-btn" id="add-blocked-contact">＋ Block by username</button><div id="blocked-list" style="margin-top:12px">Loading blocked contacts…</div><p class="settings-note">Blocking is enforced by the matching Firestore Rules file. Publish those rules in Firebase Console before relying on it.</p></div>`;
  const list=$("#blocked-list");
  const refresh=async()=>{try{const snap=await getDocs(collection(db,"privateUsers",user.uid,"blocked"));if(snap.empty){list.innerHTML=`<p class="tiny">You have not blocked anyone.</p>`;return}list.innerHTML=snap.docs.map(d=>{const x=d.data();return `<div class="settings-info"><span><b>${esc(x.name||x.username||d.id)}</b><small style="display:block;color:var(--muted)">@${esc(x.username||"")}</small></span><button class="secondary-setting-btn" data-unblock="${esc(d.id)}">Unblock</button></div>`}).join("");list.querySelectorAll("[data-unblock]").forEach(b=>b.onclick=async()=>{try{await deleteDoc(doc(db,"privateUsers",user.uid,"blocked",b.dataset.unblock));say("Contact unblocked");refresh()}catch(e){say(err(e))}})}catch(e){list.innerHTML=`<p class="tiny">Could not load blocked contacts: ${esc(err(e))}</p>`}};
  $("#add-blocked-contact").onclick=async()=>{const name=prompt("Enter the exact username to block (without @)");if(!name)return;const uname=name.trim().replace(/^@/,"").toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(uname))return say("Enter a valid username");try{const found=await getDocs(query(collection(db,"profiles"),where("username","==",uname),limit(1)));if(found.empty)return say("Username not found");const target=found.docs[0];if(target.id===user.uid)return say("You cannot block yourself");await setDoc(doc(db,"privateUsers",user.uid,"blocked",target.id),{uid:target.id,name:target.data().name||uname,username:uname,createdAt:serverTimestamp()});say("Contact blocked");refresh()}catch(e){say(err(e))}};
  refresh();return;
 }
 if(which==="chats"){
  const v=localStorage.getItem("hibuddy-chat-font")||"12",send=localStorage.getItem("hibuddy-enter-send")!=="false";
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Chat appearance</div><label class="settings-field">Message text size<select id="chat-font-size"><option value="11" ${v==="11"?"selected":""}>Small</option><option value="12" ${v==="12"?"selected":""}>Medium</option><option value="14" ${v==="14"?"selected":""}>Large</option><option value="16" ${v==="16"?"selected":""}>Extra large</option></select></label><label class="settings-toggle"><span><b>Enter to send</b><small>Preference saved on this device</small></span><input id="enter-send-setting" type="checkbox" ${send?"checked":""}></label><button class="primary-setting-btn" id="save-chat-display">Save preferences</button></div>`;
  $("#save-chat-display").onclick=()=>{const z=$("#chat-font-size").value;localStorage.setItem("hibuddy-chat-font",z);localStorage.setItem("hibuddy-enter-send",String($("#enter-send-setting").checked));document.documentElement.style.setProperty("--chat-font",z+"px");document.querySelectorAll(".bubble").forEach(el=>el.style.fontSize=z+"px");say("Chat preferences saved")};return;
 }
 if(which==="notifications"){
  const supported="Notification" in window,state=supported?Notification.permission:"unsupported";
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Notifications</div><p>Browser permission lets this site show notifications. Background push messages also require Firebase Cloud Messaging setup, a VAPID key and token handling.</p><div class="settings-info"><span>Browser permission</span><b>${esc(state)}</b></div>${state==="default"?'<button class="primary-setting-btn" id="allow-notifications">Allow notifications</button>':state==="denied"?'<p class="settings-note">Permission is blocked. Change it in your browser site settings.</p>':state==="granted"?'<p class="settings-note">Permission granted; background FCM delivery is not confirmed.</p>':'<p class="settings-note">Notifications are not supported by this browser.</p>'}</div>`;
  const b=$("#allow-notifications");if(b)b.onclick=async()=>{try{const r=await Notification.requestPermission();settingAction("notifications");say("Permission: "+r)}catch(e){say("Could not request permission")}};return;
 }
 if(which==="storage"){
  box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Storage & data</div><p id="storage-usage">Checking browser storage…</p><div class="settings-info"><span>Cloud messages</span><b>Firebase Firestore</b></div><button class="secondary-setting-btn" id="refresh-storage">Refresh estimate</button><button class="danger-setting-btn" id="clear-app-cache">Clear app cache</button><p class="settings-note">Clearing cache does not delete your Firebase account or cloud messages. The app may need to reload.</p></div>`;
  const refresh=async()=>{const el=$("#storage-usage");try{if(navigator.storage?.estimate){const x=await navigator.storage.estimate();el.textContent=`Approx. ${((x.usage||0)/1048576).toFixed(2)} MB used of ${((x.quota||0)/1048576).toFixed(0)} MB estimated browser quota.`}else el.textContent="Storage estimate is not supported by this browser."}catch{el.textContent="Storage estimate unavailable."}};refresh();$("#refresh-storage").onclick=refresh;
  $("#clear-app-cache").onclick=async()=>{if(!confirm("Clear cached app files? Firebase cloud data will remain safe."))return;try{if("caches" in window){for(const key of await caches.keys())if(key.toLowerCase().includes("buddy"))await caches.delete(key)}say("App cache cleared. Reload the app.")}catch(e){say("Could not clear app cache")}};return;
 }
 if(which==="language"){box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Language</div><p>English is the currently implemented interface language. Other languages are not offered until all app screens are translated.</p></div>`;return}
 if(which==="help"){box.innerHTML=`<div class="settings-detail"><div class="detail-heading">Help & support</div><p>For help, share the screen and exact error message with the app administrator. Never share your password or verification codes.</p></div>`;return}
 if(which==="about"){box.innerHTML=`<div class="settings-detail"><div class="detail-heading">HI BUDDY</div><p>Compact chat application using your existing Firebase Authentication and Cloud Firestore project.</p><div class="settings-info"><span>Backend</span><b>Firebase Auth + Firestore</b></div><div class="settings-info"><span>Version</span><b>1.2.0</b></div></div>`;return}
}
function tab(t){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
 $("#workspace").classList.remove("chat-open");$("#chat").classList.add("hidden");$("#empty").classList.add("hidden");$("#page").classList.remove("hidden");
 if(t==="chats"){active=null;$("#page").classList.add("hidden");$("#empty").classList.remove("hidden");return}
 // Make the main page visible on mobile for Settings, Updates and Calls
 $("#workspace").classList.add("chat-open");
 if(t==="updates")$("#page").innerHTML='<h2>Updates</h2><div class="settings-card"><b>Updates are not available yet</b><p class="tiny">Status publishing and viewing need additional backend features.</p></div>';
 if(t==="calls")$("#page").innerHTML='<h2>Calls</h2><div class="settings-card"><b>Calling is not available yet</b><p class="tiny">Voice and video calling need a calling service and permissions.</p></div>';
 if(t==="settings")settingsHome();
}
function toggleTheme(){let next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("hibuddy-theme",next)}catch{}}
try{let saved=localStorage.getItem("hibuddy-theme");if(saved)document.documentElement.dataset.theme=saved;let fs=localStorage.getItem("hibuddy-chat-font");if(fs)document.documentElement.style.setProperty("--chat-font",fs+"px")}catch{}
$("#theme").onclick=toggleTheme;$("#add").onclick=newChat;$("#newchat").onclick=newChat;$("#settings").onclick=()=>tab("settings");$("#find").onclick=()=>$("#searchinput").focus();$("#searchinput").oninput=draw;$("#people").onclick=e=>{let b=e.target.closest("[data-id]");if(b)openChat(b.dataset.id)};$("#back").onclick=()=>{active=null;$("#workspace").classList.remove("chat-open");$("#chat").classList.add("hidden");$("#empty").classList.remove("hidden")};$("#send").onclick=send;$("#message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.tab));authUI();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d8b70">
<title>HI BUDDY</title>
<style>
:root{color-scheme:light;--bg:#f4f7f6;--panel:#fff;--panel2:#f7faf9;--ink:#172b27;--muted:#84938f;--line:#e7eeeb;--brand:#0b9677;--brand2:#08735e;--tint:#e2f6ef;--shadow:0 18px 60px #173b3010}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101816;--panel:#17211e;--panel2:#1d2a26;--ink:#edf7f2;--muted:#91a69e;--line:#2b3a35;--brand:#34c49b;--brand2:#1ba783;--tint:#203d34;--shadow:0 18px 60px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #20b58b55;outline-offset:2px}
.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted);line-height:1.55}
#auth{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#bdebdc55,transparent 35%),radial-gradient(ellipse at 85% 85%,#a9d9ca44,transparent 35%),var(--bg)}
.auth-shell{width:min(440px,100%);padding:34px;background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#31cba0,#08745e);display:grid;place-items:center;color:white;font-size:23px;font-weight:900;box-shadow:0 8px 20px #0a987633}.brand-name{font-size:19px;font-weight:850;letter-spacing:.04em}.brand-tag{font-size:10px;color:var(--muted);margin-top:2px}
.auth-intro{margin:30px 0 22px}.auth-intro h1{font-size:27px;letter-spacing:-.045em;margin:0 0 7px}.auth-intro p{color:var(--muted);font-size:12px;margin:0;line-height:1.6}
.field{display:block;margin:14px 0}.field span{display:block;font-size:11px;font-weight:750;color:var(--muted);margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:0 14px;color:var(--ink);font-size:13px;outline:0}.field input:focus{border-color:var(--brand)}
.captcha{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px dashed var(--line);border-radius:13px;background:var(--panel2);font-size:12px;margin:17px 0}.captcha input{width:68px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:5px 8px}
.primary{border:0;border-radius:13px;background:var(--brand);color:#fff;font-size:13px;font-weight:800;padding:0 18px;height:48px;transition:.18s}.primary:hover{background:var(--brand2);transform:translateY(-1px)}.wide{width:100%;margin-top:5px}.text-btn{border:0;background:none;color:var(--brand);font-size:12px;font-weight:800;padding:10px}.auth-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.auth-note{margin-top:18px}
#app{height:100dvh;max-width:1320px;margin:auto;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.topbar{height:70px;flex:none;display:flex;align-items:center;padding:0 22px;gap:14px;border-bottom:1px solid var(--line);background:var(--panel)}.topbar .brand{flex:1}.topbar .brand-mark{width:38px;height:38px;border-radius:13px;font-size:19px}.icon-btn{height:40px;min-width:40px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--ink);font-size:17px;display:grid;place-items:center}.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.workspace{flex:1;min-height:0;display:flex}.sidebar{width:365px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}.side-head{padding:23px 20px 15px;display:flex;align-items:center;justify-content:space-between}.side-head h2{font-size:23px;letter-spacing:-.04em;margin:0}.side-actions{display:flex;gap:7px}.search-wrap{margin:0 18px 15px;padding:0 13px;height:43px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;gap:9px;color:var(--muted)}.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px}
.chat-list{overflow:auto;padding:0 10px 14px}.person{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 10px;border:0;border-radius:15px;background:transparent;color:var(--ink);transition:.15s}.person:hover,.person.selected{background:var(--panel2)}.avatar{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#9bd9c4,#267b65);color:white;font-size:13px;font-weight:850}.person-info{flex:1;min-width:0}.person-name{font-size:13px;font-weight:800}.person-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.person-time{font-size:9px;color:var(--muted);align-self:flex-start;padding-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:28px}.welcome-mark{width:86px;height:86px;border-radius:28px;background:var(--tint);display:grid;place-items:center;color:var(--brand);font-size:35px;margin:0 auto 18px}.welcome h2{font-size:24px;letter-spacing:-.04em;margin:0 0 8px}.welcome p{font-size:12px;color:var(--muted);line-height:1.65;max-width:290px;margin:auto}
.chat-view{height:100%;display:flex;flex-direction:column;min-height:0}.chat-head{height:70px;flex:none;display:flex;align-items:center;gap:11px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}.chat-head .avatar{width:42px;height:42px;border-radius:15px}.chat-title{font-size:13px;font-weight:850}.chat-status{font-size:10px;color:var(--muted);margin-top:3px}.grow{flex:1}
.messages{flex:1;overflow:auto;padding:24px clamp(14px,4vw,56px);display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(72%,520px);align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:17px 17px 17px 5px;padding:11px 14px;font-size:12px;line-height:1.55;overflow-wrap:anywhere;box-shadow:0 3px 12px #102c2008}.bubble.mine{align-self:flex-end;background:var(--tint);border-color:transparent;border-radius:17px 17px 5px 17px}.bubble small{display:block;text-align:right;color:var(--muted);font-size:9px;margin-top:5px}
.composer-wrap{padding:12px 20px max(12px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.composer{display:flex;align-items:flex-end;gap:9px;padding:6px 7px 6px 14px;border:1px solid var(--line);border-radius:17px;background:var(--panel2)}.composer textarea{flex:1;min-width:0;max-height:110px;min-height:38px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px;padding:10px 0}.send-btn{width:40px;height:40px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-size:16px}
.bottom-nav{height:68px;flex:none;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.tab{flex:1;border:0;background:none;color:var(--muted);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab span{font-size:10px;font-weight:700}.tab.active{color:var(--brand)}
.page{padding:25px;overflow:auto;animation:rise .2s}.page h2{font-size:23px;letter-spacing:-.04em;margin:0 0 6px}.page-sub{font-size:12px;color:var(--muted);margin:0 0 20px}.settings-card{padding:17px 18px;border:1px solid var(--line);border-radius:17px;background:var(--panel);margin:12px 0}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.setting-row:last-child{border-bottom:0}.toast{position:fixed;z-index:10;bottom:82px;left:50%;transform:translate(-50%,12px);opacity:0;background:#172b27;color:white;border-radius:12px;padding:11px 16px;font-size:11px;transition:.2s;max-width:90%;text-align:center;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){#app{width:100%;border:0}.topbar{height:60px;padding:0 14px}.topbar .brand-mark{width:34px;height:34px}.sidebar{width:100%;border:0}.main{display:none}.workspace.chat-open .sidebar{display:none}.workspace.chat-open .main{display:flex}.side-head{padding:18px 16px 13px}.side-head h2{font-size:21px}.search-wrap{margin:0 14px 12px}.chat-head{height:60px;padding:0 12px}.messages{padding:15px 12px}.bubble{max-width:88%}.composer-wrap{padding:9px 10px max(9px,env(safe-area-inset-bottom))}.bottom-nav{height:64px}}
@media(min-width:821px){#app{height:min(940px,100dvh)}.bottom-nav{display:none}.chat-head .back-btn{display:none}}
@media(max-width:420px){.auth-shell{padding:25px 21px;border-radius:23px}.auth-intro h1{font-size:24px}.brand-name{font-size:17px}}
</style>
</head>
<body>
<section id="auth"><div class="auth-shell"><div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">HI BUDDY</div><div class="brand-tag">Simple. Private. Together.</div></div></div><div id="authform"></div></div></section>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">HI BUDDY</div><div class="brand-tag">Your space to connect</div></div></div><button class="icon-btn" id="theme" title="Toggle theme">◐</button><button class="icon-btn" id="add" title="New chat">＋</button><button class="icon-btn" id="settings" title="Settings">⚙</button></header>
<div class="workspace" id="workspace">
<aside class="sidebar"><div class="side-head"><h2 id="heading">Messages</h2><div class="side-actions"><button class="icon-btn" id="find" title="Search">⌕</button><button class="icon-btn" id="newchat" title="New chat">＋</button></div></div><div class="search-wrap"><span>⌕</span><input id="searchinput" placeholder="Search conversations"></div><div class="chat-list" id="people"></div></aside>
<main class="main"><div class="welcome" id="empty"><div><div class="welcome-mark">✉</div><h2>Your conversations, together.</h2><p>Pick a conversation from the list or start a new chat with a username.</p></div></div>
<div class="chat-view hidden" id="chat"><div class="chat-head"><button class="icon-btn back-btn" id="back">‹</button><div class="avatar" id="chatavatar">?</div><div><div class="chat-title" id="chatname">Chat</div><div class="chat-status">HI BUDDY conversation</div></div><div class="grow"></div><button class="icon-btn" title="More options" id="chatmore">···</button></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><textarea id="message" rows="1" placeholder="Write a message…"></textarea><button class="send-btn" id="send" title="Send">➤</button></div></div></div><div class="page hidden" id="page"></div></main>
</div>
<nav class="bottom-nav"><button class="tab active" data-tab="chats">▤<span>Chats</span></button><button class="tab" data-tab="updates">◉<span>Updates</span></button><button class="tab" data-tab="calls">☎<span>Calls</span></button><button class="tab" data-tab="settings">⚙<span>Settings</span></button></nav></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,onSnapshot,addDoc,serverTimestamp,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyASzfkpNVtanzi2XQIBYmvxXPTUcqZ6NBM",authDomain:"raj-11988.firebaseapp.com",databaseURL:"https://raj-11988-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"raj-11988",storageBucket:"raj-11988.firebasestorage.app",messagingSenderId:"1080242151967",appId:"1:1080242151967:web:1cc8fb6fc8a9e94b2e2b2a",measurementId:"G-CPHXNZQFNN"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s);
let mode="signup",captcha=0,user=null,profile=null,chats=[],active=null,stopChats=null,stopMsgs=null;
function say(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600)}
function email(p){return p+"@hibuddy.invalid"}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ini(s=""){return s.split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase()}
function err(e){let c=e.code||"";if(c.includes("email-already-in-use"))return"Mobile number already registered";if(c.includes("invalid-credential"))return"Mobile number or password is incorrect";if(c.includes("weak-password"))return"Password must be at least 6 characters";if(c.includes("operation-not-allowed"))return"Enable Email/Password in Firebase Authentication";if(c.includes("permission-denied"))return"Firestore rules denied access. Check your Rules tab.";return e.message||"Something went wrong"}
function authUI(){let f=$("#authform");if(mode==="signup"){let a=2+Math.floor(Math.random()*7),b=1+Math.floor(Math.random()*8);captcha=a+b;f.innerHTML='<div class="auth-intro"><h1>Create your account</h1><p>Join HI BUDDY and start a conversation.</p></div><label class="field"><span>Mobile number</span><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label><label class="field"><span>Full name</span><input id="fullname" placeholder="Your full name"></label><label class="field"><span>Username</span><input id="username" placeholder="3–20 letters, numbers or _"></label><label class="field"><span>Password</span><input id="password" type="password" placeholder="At least 6 characters"></label><div class="captcha"><span>Human check&nbsp; <b>'+a+' + '+b+' = ?</b></span><input id="answer" inputmode="numeric" aria-label="Captcha answer"></div><button class="primary wide" id="signup">Create account&nbsp; →</button><div class="auth-foot"><span class="tiny">Already have an account?</span><button class="text-btn" id="toLogin">Log in</button></div><p class="tiny auth-note">Your mobile number is used as an account ID; this form does not verify phone ownership.</p>';$("#signup").onclick=signup;$("#toLogin").onclick=()=>{mode="login";authUI()}}else{f.innerHTML='<div class="auth-intro"><h1>Welcome back</h1><p>Log in to pick up where you left off.</p></div><label class="field"><span>Mobile number</span><input id="lphone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label><label class="field"><span>Password</span><input id="lpassword" type="password" placeholder="Your password"></label><button class="primary wide" id="login">Log in&nbsp; →</button><div class="auth-foot"><span class="tiny">New to HI BUDDY?</span><button class="text-btn" id="toSignup">Create account</button></div>';$("#login").onclick=login;$("#toSignup").onclick=()=>{mode="signup";authUI()}}}
async function signup(){let p=$("#phone").value.trim(),n=$("#fullname").value.trim(),u=$("#username").value.trim().toLowerCase(),pw=$("#password").value;if(!/^\d{10}$/.test(p)||!n||!/^[a-z0-9_]{3,20}$/.test(u)||pw.length<6||Number($("#answer").value)!==captcha)return say("Check your details and CAPTCHA");try{let taken=await getDocs(query(collection(db,"profiles"),where("username","==",u),limit(1)));if(!taken.empty)return say("Username already taken");let cr=await createUserWithEmailAndPassword(auth,email(p),pw);await setDoc(doc(db,"profiles",cr.user.uid),{name:n,username:u,createdAt:serverTimestamp()});say("Account created")}catch(e){say(err(e))}}
async function login(){let p=$("#lphone").value.trim(),pw=$("#lpassword").value;if(!/^\d{10}$/.test(p)||!pw)return say("Enter mobile number and password");try{await signInWithEmailAndPassword(auth,email(p),pw)}catch(e){say(err(e))}}
onAuthStateChanged(auth,async u=>{if(!u){user=null;profile=null;$("#app").classList.add("hidden");$("#auth").classList.remove("hidden");if(stopChats)stopChats();if(stopMsgs)stopMsgs();return}user=u;try{let s=await getDoc(doc(db,"profiles",u.uid));if(!s.exists())throw Error("Profile not found. Please contact support.");profile=s.data();$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");listen()}catch(e){say(err(e))}});
function listen(){if(stopChats)stopChats();stopChats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",user.uid)),s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>say(err(e)))}
function draw(){let term=$("#searchinput").value.toLowerCase();let rows=chats.filter(c=>(c.names?.[c.members.find(x=>x!==user.uid)]||"").toLowerCase().includes(term));$("#people").innerHTML=rows.map(c=>{let other=c.members.find(x=>x!==user.uid),n=c.names?.[other]||"Buddy";return'<button class="person '+(active===c.id?"selected":"")+'" data-id="'+c.id+'"><div class="avatar">'+esc(ini(n))+'</div><div class="person-info"><div class="person-name">'+esc(n)+'</div><div class="person-preview">'+esc(c.lastMessage||"Start a conversation")+'</div></div></button>'}).join("")||'<p class="tiny" style="padding:14px">No conversations yet. Tap + to find someone by username.</p>'}
function openChat(id){active=id;let c=chats.find(x=>x.id===id);if(!c)return;let other=c.members.find(x=>x!==user.uid),n=c.names?.[other]||"Buddy";$("#chatname").textContent=n;$("#chatavatar").textContent=ini(n);$("#workspace").classList.add("chat-open");$("#empty").classList.add("hidden");$("#page").classList.add("hidden");$("#chat").classList.remove("hidden");if(stopMsgs)stopMsgs();stopMsgs=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"),limit(150)),s=>{$("#msgs").innerHTML=s.docs.map(d=>{let m=d.data();return'<div class="bubble '+(m.sender===user.uid?"mine":"")+'">'+esc(m.text)+'<small>'+(m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Sending…")+'</small></div>'}).join("");$("#msgs").scrollTop=$("#msgs").scrollHeight},e=>say(err(e)));draw()}
async function send(){let t=$("#message").value.trim();if(!t||!active)return;$("#message").value="";try{await addDoc(collection(db,"chats",active,"messages"),{text:t,sender:user.uid,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",active),{lastMessage:t,lastAt:serverTimestamp()},{merge:true})}catch(e){$("#message").value=t;say(err(e))}}
async function newChat(){let u=prompt("Enter exact username");if(!u)return;try{let s=await getDocs(query(collection(db,"profiles"),where("username","==",u.trim().toLowerCase()),limit(1)));if(s.empty)return say("Username not found");let target=s.docs[0];if(target.id===user.uid)return say("This is your own username");let old=chats.find(c=>c.members.includes(target.id)&&c.members.includes(user.uid));if(old)return openChat(old.id);let names={[user.uid]:profile.name,[target.id]:target.data().name};let r=await addDoc(collection(db,"chats"),{members:[user.uid,target.id],names,lastMessage:"",createdAt:serverTimestamp()});say("Chat created");setTimeout(()=>{let c=chats.find(x=>x.id===r.id);if(c)openChat(c.id)},700)}catch(e){say(err(e))}}
function tab(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));$("#workspace").classList.remove("chat-open");$("#chat").classList.add("hidden");$("#empty").classList.add("hidden");$("#page").classList.remove("hidden");if(t==="chats"){active=null;$("#page").classList.add("hidden");$("#empty").classList.remove("hidden");return}if(t==="updates")$("#page").innerHTML='<h2>Updates</h2><p class="page-sub">A space for moments and status updates.</p><div class="settings-card"><b>Coming next</b><p class="tiny">Status sharing is not enabled in this version.</p></div>';if(t==="calls")$("#page").innerHTML='<h2>Calls</h2><p class="page-sub">Stay close, wherever you are.</p><div class="settings-card"><b>Coming next</b><p class="tiny">Voice and video calling are not enabled in this version.</p></div>';if(t==="settings")$("#page").innerHTML='<h2>Settings</h2><p class="page-sub">Manage your profile and app preferences.</p><div class="settings-card"><div class="person" style="padding:0"><div class="avatar">'+esc(ini(profile.name))+'</div><div class="person-info"><div class="person-name">'+esc(profile.name)+'</div><div class="person-preview">@'+esc(profile.username)+'</div></div></div></div><div class="settings-card"><div class="setting-row"><span>Appearance</span><button class="text-btn" id="themeSetting">Toggle light / dark</button></div><div class="setting-row"><span>Account</span><button class="text-btn" id="logout">Log out</button></div></div><p class="tiny">Firebase Authentication and Firestore are used for account and chat data. Recovery codes, media sharing and calls are not enabled yet.</p>';if($("#logout"))$("#logout").onclick=()=>signOut(auth);if($("#themeSetting"))$("#themeSetting").onclick=toggleTheme}
function toggleTheme(){let next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("hibuddy-theme",next)}catch{}}
try{let saved=localStorage.getItem("hibuddy-theme");if(saved)document.documentElement.dataset.theme=saved}catch{}
$("#theme").onclick=toggleTheme;$("#add").onclick=newChat;$("#newchat").onclick=newChat;$("#settings").onclick=()=>tab("settings");$("#find").onclick=()=>$("#searchinput").focus();$("#searchinput").oninput=draw;$("#people").onclick=e=>{let b=e.target.closest("[data-id]");if(b)openChat(b.dataset.id)};$("#back").onclick=()=>{active=null;$("#workspace").classList.remove("chat-open");$("#chat").classList.add("hidden");$("#empty").classList.remove("hidden")};$("#send").onclick=send;$("#message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.tab));authUI();
</script>
</body>
</html>

name: Build HI BUDDY APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'HI_BUDDY_Android_APK_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q HI_BUDDY_Android_APK_Project.zip -d android-project
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-project/HI_BUDDY_Android_Project
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HI-BUDDY-APK
          path: android-project/HI_BUDDY_Android_Project/app/build/outputs/apk/debug/app-debug.apk
